<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      text-align: center;
      width: 350px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Siteye Giriş</h2>
    <p>Lütfen robot olmadığınızı doğrulayın</p>

    <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
    
    <button id="loginBtn" class="btn btn-danger mt-3 w-100">Giriş Yap</button>
  </div>

  <script>
    document.getElementById("loginBtn").addEventListener("click", function() {
      if (grecaptcha.getResponse().length !== 0) {
        alert("Başarılı! Ana sayfaya yönlendiriliyorsunuz...");
        window.location.href = "file:///C:/Users/CASPER/Desktop/nutlab/index.html"; // burayı istediğin sayfaya yönlendirebilirsin
      } else {
        alert("Lütfen reCAPTCHA'yı doğrulayın!");
      }
    });
  </script>
</body>
</html>
